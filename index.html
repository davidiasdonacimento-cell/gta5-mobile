<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#080d18" />
    <meta name="description" content="Projeto independente de jogo mobile de mundo aberto em 3D." />
    <title>GTA5 Mobile — Open World</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Cena 3D do jogo"></canvas>
      <div id="loading">CARREGANDO MUNDO…</div>
      <header id="topbar"><strong>GTA5 <span>MOBILE</span></strong><small>OPEN WORLD • DEV BUILD</small></header>
      <section id="hud">
        <div class="hud-card"><small>STATUS</small><b id="status">Explorando</b></div>
        <div class="hud-card"><small>VELOCIDADE</small><b id="speed">0 km/h</b></div>
      </section>
      <div id="controls">
        <div id="move-pad" aria-label="Controles de movimento">
          <button data-dir="forward">▲</button>
          <div><button data-dir="left">◀</button><button data-dir="back">▼</button><button data-dir="right">▶</button></div>
        </div>
        <button id="jump">PULAR</button>
      </div>
      <div id="toast" role="status"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
