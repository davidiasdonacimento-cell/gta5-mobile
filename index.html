<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#080d18"><meta name="description" content="Jogo independente de mundo aberto 3D para dispositivos móveis.">
  <title>GTA5 Mobile — Open World</title>
</head>
<body>
<div id="app">
  <canvas id="game-canvas" aria-label="Mundo 3D"></canvas>
  <div id="loading"><div class="loader-mark">G5</div><b>INICIALIZANDO CIDADE</b><small>PREPARANDO O MUNDO ABERTO</small></div>
  <div id="game-vignette"></div>
  <header id="topbar"><div class="brand">GTA5 <span>MOBILE</span><small>OPEN WORLD • BUILD 0.3</small></div><button id="pause-button" class="icon-button" aria-label="Pausar">Ⅱ</button></header>
  <section id="hud">
    <div class="hud-card"><small>ESTADO</small><b id="status">Explorando</b></div>
    <div class="hud-card"><small>VELOCIDADE</small><b id="speed">0 km/h</b></div>
    <div class="hud-card money-card"><small>DINHEIRO</small><b id="money">$ 2.500</b></div>
  </section>
  <div id="mission-banner" class="mission-banner hidden"><small>OBJETIVO ATUAL</small><b id="mission-title"></b></div>
  <canvas id="minimap" width="128" height="128" aria-label="Minimapa"></canvas>
  <div id="controls">
    <div id="move-pad"><button data-dir="forward">▲</button><div><button data-dir="left">◀</button><button data-dir="back">▼</button><button data-dir="right">▶</button></div></div>
    <div class="action-stack"><button id="interact-button" class="action-button hidden">INTERAGIR</button><button id="jump" class="action-button">PULAR</button></div>
  </div>
  <div id="toast" role="status"></div>
  <div id="menu-screen" class="screen active">
    <div class="menu-backdrop"></div><div class="menu-content">
      <div class="eyebrow"><i></i PROJETO INDEPENDENTE • MUNDO ABERTO</div>
      <div class="hero-title">GRAND<br><span>THEFT</span><br>AUTO <em>V</em></div>
      <p class="hero-subtitle">A CIDADE É SUA. EXPLORE NO SEU RITMO.</p>
      <div class="menu-actions"><button id="play-button" class="primary-button"><span>▶</span> JOGAR AGORA</button><button data-panel="garage" class="menu-button">GARAGEM <span>↗</span></button><button data-panel="store" class="menu-button">LOJAS <span>↗</span></button><button data-panel="missions" class="menu-button">MISSÕES <span>↗</span></button><button data-panel="settings" class="menu-button">CONFIGURAÇÕES <span>⚙</span></button></div>
      <div class="menu-footer"><span>EXPERIÊNCIA MOBILE</span><span>VERSÃO 0.3.0</span></div>
    </div>
  </div>
  <div id="panel-screen" class="screen"><div class="panel-card"><button id="close-panel" class="close-button">✕</button><div class="eyebrow">CENTRAL DA CIDADE</div><h2 id="panel-title">GARAGEM</h2><div id="panel-content"></div></div></div>
  <div id="pause-screen" class="screen"><div class="panel-card pause-card"><div class="eyebrow">JOGO PAUSADO</div><h2>PAUSA</h2><button id="resume-button" class="primary-button">CONTINUAR</button><button id="menu-button" class="menu-button">VOLTAR AO MENU</button></div></div>
</div>
<script type="module" src="/src/main.js"></script>
</body></html>
